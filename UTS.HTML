<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS AUTENTIKASI MODERN SPLIT-SCREEN</title>
        <link rel="stylesheet" type="text/css" href="UTS.CSS">
</head>
<body>
    <main class="auth-container">
        <!-- Kolom Kiri: Ilustrasi Gambar -->
        <section class="auth-left">
            <img src="image.png" alt="Authentication Illustration" class="illustration-img">
        </section>

        <!-- Kolom Kanan: Form Login -->
        <section class="auth-right">
            <div class="form-wrapper">
                <!-- Logo Section -->
                <div class="logo-section">
                    <img src="logo.png" alt="SessionHub Logo" class="logo-img">
                    <h1 class="logo-text">SessionHub</h1>
                </div>

                <!-- Form Header -->
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>

                <!-- Form Login -->
                <form class="login-form">
                    <!-- Tombol Google SSO -->
                    <button type="button" class="btn-google" aria-label="Sign in with Google">
                        <span>G</span>
                        Sign in with Google
                    </button>

                    <!-- Divider -->
                    <div class="divider">
                        <span>or</span>
                    </div>

                    <!-- Input Email -->
                    <div class="form-group">
                        <label for="email">Email or Username</label>
                        <input type="text" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <!-- Input Password -->
                    <div class="form-group">
                        <div class="password-header">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <!-- Checkbox Remember -->
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <!-- Tombol Sign In -->
                    <button type="submit" class="btn-signin">Sign In</button>
                </form>

                <!-- Sign Up Link -->
                <p class="signup-prompt">Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </section>
    </main>
</body>
</html>
